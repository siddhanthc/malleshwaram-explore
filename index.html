<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malleshwaram Guide — Temples, Eateries &amp; Landmarks</title>
  <meta name="description" content="An interactive 3D map guide to Malleshwaram, Bangalore — discover iconic temples, legendary eateries, and cultural landmarks.">

  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Malleshwaram Guide</h1>
      <p>Temples, eateries &amp; landmarks of one of Bangalore's oldest neighbourhoods</p>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-category="all">All</button>
      <button class="filter-tab" data-category="temple">Temples</button>
      <button class="filter-tab" data-category="eatery">Eateries</button>
      <button class="filter-tab" data-category="landmark">Landmarks</button>
    </div>

    <div class="place-list"></div>
  </div>

  <!-- Sidebar toggle -->
  <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9664;</button>

  <!-- App scripts (order matters: data → ui → app) -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
